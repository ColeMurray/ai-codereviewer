name: "AI Code Review Action"
description: "Perform code reviews and comment on diffs using OpenAI API."
inputs:
  GITHUB_TOKEN:
    description: "GitHub token to interact with the repository."
    required: true
  OPENAI_API_KEY:
    description: "OpenAI API key for GPT."
    required: true
  OPENAI_API_MODEL:
    description: "OpenAI API model."
    required: false
    default: "gpt-4o"

  REVIEW_LABEL:
    description: "Only run if this label is present on the pull request"
    required: false
    default: ""

  LANGFUSE_SECRET_KEY:
    description: "Langfuse secret key"
    required: false

  LANGFUSE_PUBLIC_KEY:
    description: "Langfuse public key"
    required: false

  LANGFUSE_HOST:
    description: "Langfuse host"
    required: false

  exclude:
    description: "Glob patterns to exclude files from the diff analysis"
    required: false
    default: ""
runs:
  using: "node16"
  main: "dist/index.js"
branding:
  icon: "aperture"
  color: "green"
